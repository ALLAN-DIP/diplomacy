services:
  diplomacy:
    image: ghcr.io/allan-dip/diplomacy:${TAG:-latest}
    container_name: diplomacy
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-missing}
    environment:
      # Default to only loading standard map to save minutes on server start
      MAPS_TO_LOAD: ${MAPS_TO_LOAD:-standard.map}
      SERVER_PORT: 8433
      ALLOWED_ORIGINS: "diplomacy.feng-gu.com,diplomacy-api.feng-gu.com,https://diplomacy.feng-gu.com,https://diplomacy-api.feng-gu.com,*"
    volumes:
      - .cache/maps/:/app/maps/
      - ./diplomacy/server/connection_handler.py:/app/diplomacy/server/connection_handler.py
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: diplomacy-cloudflared
    restart: unless-stopped
    read_only: true
    volumes:
      - ./cloudflared-config:/root/.cloudflared/
    command: [ "tunnel", "run", "d0efba8a-ad98-4e43-be1e-647fb2e21f78" ]
    user: root
    depends_on:
      - diplomacy
